<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Copita</title>
<style>
  /* ---- design tokens -------------------------------------------------- */
  :root {
    --bg: #ffffff;
    --bg-sunken: #f4f4f5;
    --card: #ffffff;
    --card-hover: #fafafa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #18181b;
    --text-dim: #71717a;
    --text-faint: #a1a1aa;
    --accent: #ea580c;
    --accent-hover: #c2410c;
    --accent-soft: #fff1e9;
    --good: #16a34a;
    --bad: #dc2626;
    --radius: 10px;
    --radius-sm: 7px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --bg-sunken: #202023;
      --card: #232326;
      --card-hover: #2a2a2e;
      --border: #333338;
      --border-strong: #3f3f46;
      --text: #f4f4f5;
      --text-dim: #a1a1aa;
      --text-faint: #71717a;
      --accent: #fb7c3a;
      --accent-hover: #fd8f53;
      --accent-soft: #3a2417;
      --good: #4ade80;
      --bad: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.4);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 384px;
    max-height: 580px;
    overflow-y: auto;
    font: 13px/1.45 var(--font);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  body::-webkit-scrollbar { width: 8px; }
  body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  /* ---- header ------------------------------------------------------- */
  header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 13px 15px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  .mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--accent);
    display: grid; place-items: center;
    flex: none;
  }
  .mark svg { width: 13px; height: 13px; fill: #fff; }
  .brand { font-weight: 650; font-size: 14px; letter-spacing: -.01em; flex: 1; }
  .bridge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 550;
    color: var(--text-dim);
    padding: 3px 8px 3px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .bridge .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-faint);
    box-shadow: 0 0 0 0 currentColor;
  }
  .bridge.up { color: var(--good); }
  .bridge.up .dot { background: currentColor; animation: pulse 2s infinite; }
  .bridge.down { color: var(--bad); }
  .bridge.down .dot { background: currentColor; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(22,163,74,.4); }
    70% { box-shadow: 0 0 0 5px rgba(22,163,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); }
  }

  /* ---- send box ---------------------------------------------------- */
  .send-box { padding: 13px 15px; display: flex; flex-direction: column; gap: 8px; }
  .field {
    display: flex; gap: 7px;
  }
  input[type="text"] {
    flex: 1; min-width: 0;
    padding: 8px 10px;
    font: inherit;
    color: var(--text);
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: var(--radius-sm);
    transition: background .12s, opacity .12s, transform .04s;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: default; }
  .btn-primary {
    padding: 8px 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    white-space: nowrap;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .hint { font-size: 11px; color: var(--text-faint); min-height: 13px; }
  .hint.ok { color: var(--good); }
  .hint.err { color: var(--bad); }

  /* ---- sections --------------------------------------------------- */
  section { padding: 4px 15px 14px; }
  .sec-head {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 650;
    text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-faint);
    margin: 6px 0 9px;
  }
  .sec-head .count {
    font-size: 10px;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 0 6px;
    border-radius: 999px;
    letter-spacing: 0;
  }
  .empty {
    font-size: 12px; color: var(--text-faint);
    padding: 10px 12px;
    background: var(--bg-sunken);
    border-radius: var(--radius-sm);
    text-align: center;
  }

  /* ---- task cards ----------------------------------------------- */
  .task {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 11px;
    margin-bottom: 7px;
    box-shadow: var(--shadow);
  }
  .task-top { display: flex; align-items: flex-start; gap: 8px; }
  .task-glyph {
    width: 28px; height: 28px; flex: none;
    border-radius: 7px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
  }
  .task-glyph svg, .res-glyph svg, .fglyph svg { width: 16px; height: 16px; display: block; }
  .res-glyph, .fglyph { color: var(--text-dim); }
  .task-name {
    flex: 1; min-width: 0;
    font-size: 12.5px; font-weight: 550;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .task-sub .status-word { color: var(--accent); font-weight: 600; text-transform: capitalize; }
  .task-sub.failed .status-word { color: var(--bad); }
  .task-sub.done .status-word { color: var(--good); }

  .bar {
    height: 5px; margin-top: 9px;
    background: var(--bg-sunken);
    border-radius: 3px; overflow: hidden;
  }
  .bar > i {
    display: block; height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width .3s ease;
  }
  .bar.indet > i {
    width: 35% !important;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { margin-left: -35%; } 100% { margin-left: 100%; }
  }

  .task-actions {
    display: flex; gap: 6px; margin-top: 9px;
  }
  .task-actions button {
    flex: 1;
    padding: 5px 8px;
    font-size: 11px; font-weight: 600;
    color: var(--text-dim);
    background: var(--bg-sunken);
    border: 1px solid var(--border);
  }
  .task-actions button:hover:not(:disabled) {
    color: var(--text); border-color: var(--border-strong);
  }
  .task-actions button.danger:hover { color: var(--bad); border-color: var(--bad); }
  .task-actions button.go { color: var(--accent); }

  /* ---- resource cards ----------------------------------------- */
  .res {
    display: flex; align-items: center; gap: 9px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .res:hover { border-color: var(--accent); background: var(--card-hover); }
  .res-glyph {
    width: 24px; height: 24px; flex: none;
    border-radius: 6px;
    background: var(--bg-sunken);
    display: grid; place-items: center;
    font-size: 13px;
  }
  .res-body { flex: 1; min-width: 0; }
  .res-name {
    font-size: 12px; font-weight: 550;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .res-meta { font-size: 10.5px; color: var(--text-faint); margin-top: 1px; }
  .res-send {
    font-size: 11px; font-weight: 650; color: var(--accent);
    flex: none;
    opacity: 0; transition: opacity .12s;
  }
  .res:hover .res-send { opacity: 1; }

  /* ---- folder checklist ------------------------------------------ */
  .folder-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .folder-all { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); cursor: pointer; }
  .btn-mini {
    padding: 5px 11px; font-size: 11.5px; font-weight: 650;
    color: #fff; background: var(--accent);
  }
  .btn-mini:hover:not(:disabled) { background: var(--accent-hover); }
  .fitem {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; margin-bottom: 5px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .fitem:hover { border-color: var(--border-strong); }
  .fitem input { flex: none; }
  .fitem .fglyph { width: 22px; height: 22px; flex: none; border-radius: 5px; background: var(--bg-sunken); display: grid; place-items: center; font-size: 12px; }
  .fitem .fbody { flex: 1; min-width: 0; }
  .fitem .fname { display: block; font-size: 12px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fitem .fmeta { display: block; font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

  /* ---- footer ------------------------------------------------- */
  footer {
    border-top: 1px solid var(--border);
    padding: 11px 15px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    position: sticky; bottom: 0;
    background: var(--bg);
  }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; color: var(--text-dim); }
  .switch input { display: none; }
  .track {
    width: 34px; height: 20px; flex: none;
    background: var(--border-strong);
    border-radius: 999px;
    position: relative;
    transition: background .15s;
  }
  .track::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .link-btn {
    background: none; color: var(--text-dim);
    font-size: 12px; font-weight: 600;
    padding: 4px 2px;
  }
  .link-btn:hover { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3v11.2l3.6-3.6L17 12l-5 5-5-5 1.4-1.4L12 14.2V3h0zM5 19h14v2H5z"/></svg>
    </span>
    <span class="brand">Copita</span>
    <span id="bridge" class="bridge"><span class="dot"></span><span id="bridge-text">Connecting…</span></span>
  </header>

  <div class="send-box">
    <div class="field">
      <input id="url" type="text" placeholder="Paste a link, or use this tab" spellcheck="false" autocomplete="off">
      <button id="send" class="btn-primary">Download</button>
    </div>
    <div id="hint" class="hint"></div>
  </div>

  <section id="tasks-sec">
    <div class="sec-head">Downloading<span id="tasks-count" class="count" hidden>0</span></div>
    <div id="tasks"><div class="empty">Nothing downloading right now.</div></div>
  </section>

  <section id="folder-sec" hidden>
    <div class="sec-head">
      <span id="folder-title">In this folder</span>
      <span id="folder-count" class="count" hidden>0</span>
    </div>
    <div class="folder-bar">
      <label class="folder-all"><input type="checkbox" id="folder-select-all"> Select all</label>
      <button id="folder-download" class="btn-mini" disabled>Download 0</button>
    </div>
    <div id="folder-items"></div>
  </section>

  <section id="res-sec">
    <div class="sec-head">On this page<span id="res-count" class="count" hidden>0</span></div>
    <div id="resources"><div class="empty">No media or files spotted yet.</div></div>
  </section>

  <footer>
    <label class="switch">
      <input type="checkbox" id="intercept">
      <span class="track"></span>
      <span>Catch browser downloads</span>
    </label>
    <button id="open-app" class="link-btn">Open app</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
